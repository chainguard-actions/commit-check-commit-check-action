name: Test author checks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gh CLI (the act image does not ship it; hosted runners do)
        run: |
          set -e
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          case "$(uname -m)" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          TAG="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest | sed 's#.*/tag/##')"
          case "$TAG" in v[0-9]*) ;; *) TAG=v2.63.2 ;; esac
          VER="${TAG#v}"
          DEST="$RUNNER_TEMP/gh-cli"
          mkdir -p "$DEST"
          curl -fsSL "https://github.com/cli/cli/releases/download/${TAG}/gh_${VER}_linux_${ARCH}.tar.gz" -o "$DEST/gh.tar.gz"
          tar -xzf "$DEST/gh.tar.gz" -C "$DEST"
          echo "$DEST/gh_${VER}_linux_${ARCH}/bin" >> "$GITHUB_PATH"
          "$DEST/gh_${VER}_linux_${ARCH}/bin/gh" --version
      - id: action
        uses: .
        with:
          message: false
          branch: false
          author-name: true
          author-email: true
          dry-run: true
      - name: Assert author scopes only
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          labels = [s["label"] for s in data.get("scopes", [])]
          print("labels:", labels)
          if labels != ["Author name", "Author email"]:
              print("FAIL: expected exactly ['Author name', 'Author email']"); sys.exit(1)
          for s in data["scopes"]:
              if s["status"] not in ("pass", "fail", "warn", "skip"):
                  print(f"FAIL: bad scope status {s['status']!r}"); sys.exit(1)
          if data.get("status") not in ("pass", "fail", "warn", "skip"):
              print("FAIL: bad overall status"); sys.exit(1)
          print("PASS")
          EOF
