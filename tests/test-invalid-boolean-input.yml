name: Test invalid boolean input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "yes"
          branch: false
      - name: Assert step failed and produced no result
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid boolean input"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no result output when inputs are invalid"
            exit 1
          fi
          echo "PASS"
