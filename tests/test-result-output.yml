name: Test result output JSON structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Write JSON validator script
        run: |
          cat > /tmp/validate_result.py << 'PYEOF'
          import sys, json, os

          raw = os.environ.get('RESULT', '')
          if not raw:
              print('FAIL: RESULT env var is empty')
              sys.exit(1)

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print('FAIL: result is not valid JSON: ' + str(e))
              sys.exit(1)

          if 'status' not in data:
              print('FAIL: result JSON missing status field. Got: ' + str(data))
              sys.exit(1)

          if 'scopes' not in data:
              print('FAIL: result JSON missing scopes field. Got: ' + str(data))
              sys.exit(1)

          status = data['status']
          valid_statuses = ('pass', 'fail', 'warn', 'skip')
          if status not in valid_statuses:
              print('FAIL: unexpected status value: ' + str(status))
              sys.exit(1)

          scopes = data['scopes']
          if not isinstance(scopes, list):
              print('FAIL: scopes is not a list. Got: ' + str(type(scopes)))
              sys.exit(1)

          print('PASS: result JSON has status=' + str(status) + ' and ' + str(len(scopes)) + ' scope(s)')
          PYEOF

      # Run with only branch check enabled to keep the scope minimal
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "false"
          branch: "true"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "false"
          pr-comments: "false"

      - name: Assert result output has expected JSON structure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            python3 /tmp/validate_result.py
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (attestation/sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
