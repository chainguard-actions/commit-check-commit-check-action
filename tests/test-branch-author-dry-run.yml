name: Test branch and author checks (dry run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gh CLI (needed for attestation verification)
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          GH_VERSION=2.63.2
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gh-cli"
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP/gh-cli" --strip-components=1
          rm -f "$RUNNER_TEMP/gh.tar.gz"
          echo "$RUNNER_TEMP/gh-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh-cli/bin/gh" --version
      - id: action
        uses: .
        with:
          message: "false"
          branch: "true"
          author-name: "true"
          author-email: "true"
          dry-run: "true"
      - name: Assert result contains Branch and Author scopes
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          if data.get("status") not in ("pass", "fail", "warn", "skip"):
              print(f"FAIL: unexpected status {data.get('status')}")
              sys.exit(1)
          labels = [s["label"] for s in data["scopes"]]
          if labels != ["Branch", "Author name", "Author email"]:
              print(f"FAIL: unexpected scopes {labels}")
              sys.exit(1)
          for s in data["scopes"]:
              if s["status"] not in ("pass", "fail", "warn", "skip"):
                  print(f"FAIL: bad scope status {s}")
                  sys.exit(1)
          print("PASS")
          EOF
