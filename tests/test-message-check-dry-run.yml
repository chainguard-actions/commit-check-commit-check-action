name: Test message check with dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock gh that bypasses attestation verify
        run: |
          REAL_GH="$(command -v gh 2>/dev/null || echo /usr/bin/gh)"
          echo "Real gh at: $REAL_GH"
          mkdir -p /tmp/mock-bin
          printf '#!/bin/sh\nif [ "$1" = "attestation" ] && [ "$2" = "verify" ]; then\n  echo "Mock: attestation verification passed (bypassed for testing)"\n  exit 0\nfi\n"%s" "$@"\n' "$REAL_GH" > /tmp/mock-bin/gh
          chmod +x /tmp/mock-bin/gh
          /tmp/mock-bin/gh attestation verify test.whl -R test/repo
          echo "Mock gh installed successfully"
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"
      - name: Run commit-check action with message check only in dry-run mode
        id: action
        uses: .
        with:
          message: "true"
          branch: "false"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "false"
          pr-comments: "false"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully with message check in dry-run mode"
          echo "PASS: message check ran in dry-run mode without failing the workflow"
