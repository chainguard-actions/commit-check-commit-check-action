name: Test non-conventional commit message fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare deterministic config and bad commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          printf '# test config: use commit-check defaults\n' > commit-check.toml
          printf '# test config: use commit-check defaults\n' > cchk.toml
          git commit --allow-empty -m "this is a bad commit message"
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "true"
          branch: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on a bad commit message"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            python3 - <<'EOF'
          import json, os, sys
          r = json.loads(os.environ["RESULT"])
          if r["status"] != "fail":
              print("FAIL: expected status fail, got", r["status"]); sys.exit(1)
          EOF
          fi
          echo "PASS"
