name: Test basic usage (default checks, dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ensure gh CLI with attestation support is available
        run: |
          if ! gh attestation --help >/dev/null 2>&1; then
            case "$(uname -m)" in
              x86_64) A=amd64 ;;
              aarch64|arm64) A=arm64 ;;
              *) A=amd64 ;;
            esac
            V=2.63.2
            curl -fsSL -o /tmp/gh.tgz "https://github.com/cli/cli/releases/download/v${V}/gh_${V}_linux_${A}.tar.gz"
            tar -xzf /tmp/gh.tgz -C /tmp
            mkdir -p "$HOME/.local/gh-bin"
            cp "/tmp/gh_${V}_linux_${A}/bin/gh" "$HOME/.local/gh-bin/gh"
            echo "$HOME/.local/gh-bin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        with:
          dry-run: "true"
      - name: Assert result output has default scopes
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: result output is empty"
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          status = data.get("status")
          print("status:", status)
          if status not in ("pass", "warn", "skip", "fail"):
              print("FAIL: unexpected status", status); sys.exit(1)
          if not isinstance(data.get("ai_tools"), list):
              print("FAIL: ai_tools is not a list"); sys.exit(1)
          labels = [s["label"] for s in data.get("scopes", [])]
          print("labels:", labels)
          if labels != ["Commit message", "Branch"]:
              print("FAIL: expected scopes ['Commit message', 'Branch']"); sys.exit(1)
          for s in data["scopes"]:
              if s["status"] not in ("pass", "warn", "skip", "fail"):
                  print("FAIL: bad scope status", s); sys.exit(1)
          print("PASS")
          EOF
