name: Test result JSON structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "true"
          branch: "true"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "false"
          pr-comments: "false"
          pr-title: "false"
      - name: Assert result JSON has expected structure or failed gracefully
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            python3 - <<'EOF'
          import sys, json, os
          result_str = os.environ.get("RESULT", "")
          try:
              data = json.loads(result_str)
          except json.JSONDecodeError as e:
              print(f"FAIL: result is not valid JSON: {e}")
              sys.exit(1)
          print(f"Parsed JSON keys: {list(data.keys())}")
          if "status" not in data:
              print(f"FAIL: result JSON missing 'status' field, got: {data}")
              sys.exit(1)
          status = data["status"]
          valid_statuses = {"pass", "fail", "warn", "skip"}
          if status not in valid_statuses:
              print(f"FAIL: unexpected status '{status}', expected one of {valid_statuses}")
              sys.exit(1)
          print(f"PASS: result has valid status='{status}'")
          EOF
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely attestation verification unavailable in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
