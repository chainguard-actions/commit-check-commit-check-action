name: Test branch check only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Mock gh CLI for attestation verification
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/gh" << 'EOF'
          #!/bin/sh
          # Mock gh CLI: always succeed for attestation verify
          if [ "$1" = "attestation" ] && [ "$2" = "verify" ]; then
            echo "Attestation verification mocked: success"
            exit 0
          fi
          if command -v /usr/bin/gh >/dev/null 2>&1; then
            exec /usr/bin/gh "$@"
          fi
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          message: "false"
          branch: "true"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "true"
          pr-comments: "false"
          pr-title: "false"

      - name: Assert branch check ran without fatal error
        run: |
          echo "Action completed with branch check only (dry-run enabled)"
          echo "PASS"
