name: Test branch check exit code matches result status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install GitHub CLI (required by the action for attestation verification)
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          GH_VERSION=2.62.0
          case "$(uname -m)" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          DIR="${RUNNER_TEMP:-/tmp}/gh-cli"
          mkdir -p "$DIR"
          URL="https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${ARCH}.tar.gz"
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL -o "$DIR/gh.tar.gz" "$URL"
          else
            python3 -c "import sys,urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$URL" "$DIR/gh.tar.gz"
          fi
          tar -xzf "$DIR/gh.tar.gz" -C "$DIR"
          "$DIR/gh_${GH_VERSION}_linux_${ARCH}/bin/gh" --version
          echo "$DIR/gh_${GH_VERSION}_linux_${ARCH}/bin" >> "$GITHUB_PATH"
      # Without dry-run the step must fail exactly when the result status is
      # "fail"; the branch name under act (act-harness) is not something the
      # test controls, so the outcome is checked for consistency with the output.
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "false"
          branch: "true"
          dry-run: "false"
      - name: Assert outcome is consistent with result status
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: result output is empty"
            exit 1
          fi
          STATUS="$(python3 -c 'import json,os; print(json.loads(os.environ["RESULT"])["status"])')"
          LABELS="$(python3 -c 'import json,os; print(",".join(s["label"] for s in json.loads(os.environ["RESULT"])["scopes"]))')"
          echo "status: $STATUS labels: $LABELS"
          if [ "$LABELS" != "Branch" ]; then
            echo "FAIL: expected a single Branch scope"
            exit 1
          fi
          if [ "$STATUS" = "fail" ]; then
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: status fail but step outcome was $OUTCOME"
              exit 1
            fi
          elif [ "$STATUS" = "pass" ] || [ "$STATUS" = "warn" ] || [ "$STATUS" = "skip" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: status $STATUS but step outcome was $OUTCOME"
              exit 1
            fi
          else
            echo "FAIL: unexpected status '$STATUS'"
            exit 1
          fi
          echo "PASS"
