name: Test with all checks disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "false"
          branch: "false"
          author-name: "false"
          author-email: "false"
          dry-run: "false"
          job-summary: "false"
          pr-comments: "false"
          pr-title: "false"
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/act-harness

      - name: Assert action ran (result set or failed gracefully on infra issues)
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            # With all checks disabled the result may be empty or contain a pass/skip status
            if [ -n "$RESULT" ]; then
              STATUS=$(echo "$RESULT" | python3 -c "import sys, json; d = json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
              echo "status: $STATUS"
              if [ "$STATUS" = "fail" ]; then
                echo "FAIL: action reported failure when all checks were disabled"
                exit 1
              fi
              echo "PASS: status is '$STATUS' with all checks disabled"
            else
              echo "PASS: result output is empty when no checks are enabled"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely attestation/infra issue under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
