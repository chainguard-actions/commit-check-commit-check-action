name: Test non-conventional branch name fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare deterministic config and bad branch
        run: |
          printf '# test config: use commit-check defaults\n' > commit-check.toml
          printf '# test config: use commit-check defaults\n' > cchk.toml
          git checkout -B not_a_conventional_branch
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "false"
          branch: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on a bad branch name"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            python3 - <<'EOF'
          import json, os, sys
          r = json.loads(os.environ["RESULT"])
          if r["status"] != "fail":
              print("FAIL: expected status fail, got", r["status"]); sys.exit(1)
          EOF
          fi
          echo "PASS"
