name: Test dry-run with bad commit message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ensure gh CLI is available
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          case "$(uname -m)" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          V=2.63.0
          curl -sSfL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${V}/gh_${V}_linux_${ARCH}.tar.gz"
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${V}_linux_${ARCH}/bin" >> "$GITHUB_PATH"
      - name: Create a commit with a non-conventional message
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit --allow-empty -m "bad msg"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          message: "true"
          branch: "false"
          dry-run: "true"
      - name: Assert result reports failure for the commit message
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: dry-run must always succeed"
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          if data["status"] != "fail":
              sys.exit(f"FAIL: expected status fail, got {data['status']}")
          scopes = [s for s in data["scopes"] if s["label"] == "Commit message"]
          if len(scopes) != 1:
              sys.exit(f"FAIL: expected one 'Commit message' scope, got {data['scopes']}")
          s = scopes[0]
          if s["status"] != "fail":
              sys.exit(f"FAIL: expected scope status fail, got {s['status']}")
          if s["sha"] != os.environ["HEAD_SHA"]:
              sys.exit(f"FAIL: expected sha {os.environ['HEAD_SHA']}, got {s['sha']}")
          if not any(c.get("status") == "fail" for c in s["checks"]):
              sys.exit("FAIL: expected at least one failing check")
          print("PASS")
          EOF
