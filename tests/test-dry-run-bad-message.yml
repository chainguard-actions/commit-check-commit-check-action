name: Test dry-run reports failure but exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ensure gh CLI is available
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          ver=2.63.2
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) arch=amd64 ;;
          esac
          curl -sSfL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_${arch}.tar.gz" -o /tmp/gh.tgz
          mkdir -p /tmp/gh && tar -xzf /tmp/gh.tgz -C /tmp/gh --strip-components=1
          echo "/tmp/gh/bin" >> "$GITHUB_PATH"
      - name: Create a commit with a non-conventional message
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit --allow-empty -m "another bad message"
      - id: action
        uses: .
        with:
          message: "true"
          branch: "false"
          dry-run: "true"
          job-summary: "false"
      - name: Assert result still reports the failure
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          if data.get("status") != "fail":
              print(f"FAIL: expected status fail, got {data.get('status')!r}"); sys.exit(1)
          labels = [s["label"] for s in data["scopes"]]
          if labels != ["Commit message"]:
              print(f"FAIL: expected only the Commit message scope, got {labels}"); sys.exit(1)
          print("PASS")
          EOF
