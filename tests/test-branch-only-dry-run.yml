name: Test branch-only check in dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feat/my-feature
      GITHUB_EVENT_NAME: push
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure gh CLI is available
        run: |
          if ! command -v gh &>/dev/null; then
            echo "Installing gh CLI..."
            type -p curl >/dev/null || (sudo apt-get update && sudo apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          gh --version
      - id: action
        uses: .
        with:
          message: "false"
          branch: "true"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "false"
          pr-comments: "false"
      - name: Assert branch-only check completed
        run: |
          echo "Branch-only check completed successfully in dry-run mode"
          echo "PASS"
