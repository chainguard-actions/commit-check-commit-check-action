name: Test all checks disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gh CLI (the act image does not ship it; hosted runners do)
        run: |
          set -e
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          case "$(uname -m)" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          TAG="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest | sed 's#.*/tag/##')"
          case "$TAG" in v[0-9]*) ;; *) TAG=v2.63.2 ;; esac
          VER="${TAG#v}"
          DEST="$RUNNER_TEMP/gh-cli"
          mkdir -p "$DEST"
          curl -fsSL "https://github.com/cli/cli/releases/download/${TAG}/gh_${VER}_linux_${ARCH}.tar.gz" -o "$DEST/gh.tar.gz"
          tar -xzf "$DEST/gh.tar.gz" -C "$DEST"
          echo "$DEST/gh_${VER}_linux_${ARCH}/bin" >> "$GITHUB_PATH"
          "$DEST/gh_${VER}_linux_${ARCH}/bin/gh" --version
      - id: action
        uses: .
        with:
          message: false
          branch: false
          author-name: false
          author-email: false
          job-summary: false
      - name: Assert status pass and no scopes
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          if data.get("status") != "pass":
              print(f"FAIL: expected status pass, got {data.get('status')!r}"); sys.exit(1)
          if data.get("scopes") != []:
              print(f"FAIL: expected no scopes, got {data.get('scopes')!r}"); sys.exit(1)
          if data.get("ai_tools", []) != []:
              print(f"FAIL: expected no ai_tools, got {data.get('ai_tools')!r}"); sys.exit(1)
          print("PASS")
          EOF
      - name: Assert installation stayed out of the workspace
        run: |
          if [ -d "$GITHUB_WORKSPACE/venv" ] || ls "$GITHUB_WORKSPACE"/*.whl >/dev/null 2>&1; then
            echo "FAIL: venv or wheels leaked into the workspace"
            exit 1
          fi
          if [ ! -d "$RUNNER_TEMP/commit-check-action/venv" ]; then
            echo "FAIL: expected venv under RUNNER_TEMP"
            exit 1
          fi
          echo "PASS"
