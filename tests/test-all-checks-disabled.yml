name: Test all checks disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gh CLI (needed for attestation verification)
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          GH_VERSION=2.63.2
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gh-cli"
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP/gh-cli" --strip-components=1
          rm -f "$RUNNER_TEMP/gh.tar.gz"
          echo "$RUNNER_TEMP/gh-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh-cli/bin/gh" --version
      - id: action
        uses: .
        with:
          message: "false"
          branch: "false"
          author-name: "false"
          author-email: "false"
          job-summary: "false"
      - name: Assert result is pass with no scopes
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: result output is empty"
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          if data.get("status") != "pass":
              print(f"FAIL: expected status pass, got {data.get('status')}")
              sys.exit(1)
          if data.get("scopes") != []:
              print(f"FAIL: expected no scopes, got {data.get('scopes')}")
              sys.exit(1)
          print("PASS")
          EOF
      - name: Assert nothing was written into the workspace
        run: |
          if [ -d "$GITHUB_WORKSPACE/venv" ] || [ -d "$GITHUB_WORKSPACE/wheels" ]; then
            echo "FAIL: action left files in workspace"
            exit 1
          fi
          if [ ! -d "$RUNNER_TEMP/commit-check-action/venv" ]; then
            echo "FAIL: expected venv under RUNNER_TEMP"
            exit 1
          fi
          echo "PASS"
