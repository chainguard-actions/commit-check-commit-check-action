name: Test non-conventional commit message fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ensure gh CLI is available
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          ver=2.63.2
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) arch=amd64 ;;
          esac
          curl -sSfL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_${arch}.tar.gz" -o /tmp/gh.tgz
          mkdir -p /tmp/gh && tar -xzf /tmp/gh.tgz -C /tmp/gh --strip-components=1
          echo "/tmp/gh/bin" >> "$GITHUB_PATH"
      - name: Create a commit with a non-conventional message
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit --allow-empty -m "this is a bad message"
          git log -1 --format=%B
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "true"
          branch: "false"
      - name: Assert the step failed and result reports the failure
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on a bad commit message"
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          if data.get("status") != "fail":
              print(f"FAIL: expected status fail, got {data.get('status')!r}"); sys.exit(1)
          scopes = {s["label"]: s for s in data["scopes"]}
          print("labels:", list(scopes))
          if "Branch" in scopes:
              print("FAIL: branch check was disabled"); sys.exit(1)
          msg = scopes.get("Commit message")
          if not msg or msg["status"] != "fail":
              print("FAIL: Commit message scope should fail"); sys.exit(1)
          if not msg.get("sha"):
              print("FAIL: Commit message scope should carry the HEAD sha"); sys.exit(1)
          print("PASS")
          EOF
