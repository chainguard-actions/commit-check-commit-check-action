name: Test message check only with dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            type -p curl >/dev/null || (apt-get update && apt-get install curl -y)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update
            apt-get install gh -y
          fi
          gh --version
      - name: Run commit-check with message check only and dry-run enabled
        id: action
        uses: .
        with:
          message: "true"
          branch: "false"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "true"
          pr-comments: "false"
      - name: Assert action succeeded in dry-run mode with message check
        run: |
          echo "Action completed successfully in dry-run mode with message check"
          echo "PASS: message check ran in dry-run mode without failing"
