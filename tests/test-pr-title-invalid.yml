name: Test pr-title enabled outside a pull_request event is skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gh CLI (needed for attestation verification)
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          GH_VERSION=2.63.2
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gh-cli"
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP/gh-cli" --strip-components=1
          rm -f "$RUNNER_TEMP/gh.tar.gz"
          echo "$RUNNER_TEMP/gh-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh-cli/bin/gh" --version
      # act always reports GITHUB_EVENT_NAME=workflow_dispatch (step env cannot
      # override it), so the PR title check must be skipped: no PR title scope,
      # and the action must succeed without dry-run.
      - id: action
        uses: .
        with:
          message: "false"
          branch: "false"
          pr-title: "true"
          dry-run: "false"
      - name: Assert PR title scope skipped outside PR events
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          titles = [s for s in data.get("scopes", []) if s.get("label") == "PR title"]
          if titles:
              print(f"FAIL: PR title scope should not run outside a PR event: {titles}")
              sys.exit(1)
          if data.get("status") != "pass":
              print(f"FAIL: expected overall pass, got {data.get('status')}")
              sys.exit(1)
          print("PASS")
          EOF
