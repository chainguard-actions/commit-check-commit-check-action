name: Test message-only check (branch disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      # Run with only message check enabled
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "true"
          branch: "false"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "false"
          pr-comments: "false"

      - name: Assert action ran with message-only configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            # Parse and validate the result
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])" 2>/dev/null || echo "")
            SCOPES=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print([s['label'] for s in d['scopes']])" 2>/dev/null || echo "")
            echo "status: $STATUS"
            echo "scopes: $SCOPES"
            if [ -z "$STATUS" ]; then
              echo "FAIL: could not parse result JSON"
              exit 1
            fi
            # When not in a PR event, message check runs as "Commit message" scope
            # Branch check should NOT appear since branch: false
            BRANCH_SCOPE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); labels=[s['label'] for s in d['scopes']]; print('yes' if 'Branch' in labels else 'no')" 2>/dev/null || echo "")
            echo "branch scope present: $BRANCH_SCOPE"
            if [ "$BRANCH_SCOPE" = "yes" ]; then
              echo "FAIL: branch scope should not be present when branch=false"
              exit 1
            fi
            echo "PASS: message-only check ran with status=$STATUS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (attestation/sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
