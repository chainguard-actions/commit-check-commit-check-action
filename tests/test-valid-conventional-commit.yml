name: Test valid conventional commit message passes check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feat/valid-commit
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update
            apt-get install -y gh
          fi
          gh --version

      - name: Configure git with a valid conventional commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a commit with a valid conventional commit message
          git commit --allow-empty -m "feat: add new feature for testing"

      - id: action
        uses: .
        with:
          message: "true"
          branch: "false"
          author-name: "false"
          author-email: "false"
          dry-run: "false"
          job-summary: "false"
          pr-comments: "false"
          pr-title: "false"

      - name: Assert action passed with valid conventional commit
        run: |
          echo "Action passed with a valid conventional commit message"
          echo "PASS"
