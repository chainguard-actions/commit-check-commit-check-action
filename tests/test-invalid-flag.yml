name: Test invalid boolean input fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ensure gh CLI with attestation support is available
        run: |
          if ! gh attestation --help >/dev/null 2>&1; then
            case "$(uname -m)" in
              x86_64) A=amd64 ;;
              aarch64|arm64) A=arm64 ;;
              *) A=amd64 ;;
            esac
            V=2.63.2
            curl -fsSL -o /tmp/gh.tgz "https://github.com/cli/cli/releases/download/v${V}/gh_${V}_linux_${A}.tar.gz"
            tar -xzf /tmp/gh.tgz -C /tmp
            mkdir -p "$HOME/.local/gh-bin"
            cp "/tmp/gh_${V}_linux_${A}/bin/gh" "$HOME/.local/gh-bin/gh"
            echo "$HOME/.local/gh-bin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "yes"
          dry-run: "true"
      - name: Assert the step failed and produced no result
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the step to fail on an invalid boolean input"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no result output when inputs are invalid"
            exit 1
          fi
          echo "PASS"
