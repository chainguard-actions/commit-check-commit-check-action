name: Test invalid boolean input fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ensure gh CLI is available
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          ver=2.63.2
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) arch=amd64 ;;
          esac
          curl -sSfL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_${arch}.tar.gz" -o /tmp/gh.tgz
          mkdir -p /tmp/gh && tar -xzf /tmp/gh.tgz -C /tmp/gh --strip-components=1
          echo "/tmp/gh/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "yes"
          dry-run: "true"
      - name: Assert the step failed without producing a result
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: an invalid boolean input must fail the step even under dry-run"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: no result expected when inputs are rejected"
            exit 1
          fi
          echo "PASS"
