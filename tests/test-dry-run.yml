name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "true"
          branch: "true"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "false"
          pr-comments: "false"
          pr-title: "false"
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/act-harness

      - name: Assert action ran (result set or failed gracefully on infra issues)
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded in dry-run mode but result output is empty"
              exit 1
            fi
            STATUS=$(echo "$RESULT" | python3 -c "import sys, json; d = json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
            echo "status: $STATUS"
            if [ -z "$STATUS" ]; then
              echo "FAIL: could not parse status from result JSON"
              exit 1
            fi
            # In dry-run mode the action exits 0 regardless of status
            echo "PASS: dry-run produced status='$STATUS' and exited 0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely attestation/infra issue under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
