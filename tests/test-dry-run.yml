name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gh CLI if missing
        run: |
          if ! command -v gh &>/dev/null; then
            echo "gh CLI not found, installing..."
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh
          else
            echo "gh CLI already available: $(gh --version)"
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "true"
          branch: "true"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "true"
          pr-comments: "false"

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            # Verify it is valid JSON
            echo "$RESULT" | python3 -c "import sys, json; d=json.load(sys.stdin); print('status:', d.get('status',''))" || {
              echo "FAIL: result is not valid JSON"
              exit 1
            }
            STATUS=$(echo "$RESULT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('status', ''))")
            echo "status: $STATUS"
            if [ -z "$STATUS" ]; then
              echo "FAIL: result JSON missing 'status' field"
              exit 1
            fi
            echo "PASS: dry-run succeeded with status=$STATUS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely gh attestation verify not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
