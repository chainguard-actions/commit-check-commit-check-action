name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Ensure gh CLI supports attestation verify
        run: |
          # Upgrade gh CLI if needed (attestation verify requires gh >= 2.49)
          GH_VERSION=$(gh --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.0.0")
          MAJOR=$(echo "$GH_VERSION" | cut -d. -f1)
          MINOR=$(echo "$GH_VERSION" | cut -d. -f2)
          echo "Current gh version: $GH_VERSION"
          if [ "$MAJOR" -lt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -lt 49 ]; }; then
            echo "Upgrading gh CLI..."
            type -p curl >/dev/null || (apt-get update && apt-get install curl -y)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update
            apt-get install gh -y
          fi
          gh --version
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run commit-check action in dry-run mode
        id: action
        uses: .
        with:
          message: "true"
          branch: "true"
          dry-run: "true"
          job-summary: "false"
      - name: Assert action completed successfully in dry-run mode
        run: |
          echo "Action completed with dry-run=true"
          echo "PASS: dry-run mode did not fail the workflow"
