name: Test commit-check dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feat/test-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git with a conventional commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit --allow-empty -m "feat: add test commit for commit-check"

      - name: Mock gh CLI to bypass attestation verification
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/gh << 'GHEOF'
          #!/bin/bash
          if [[ "$*" == *"attestation"* ]]; then
            echo "Mocked: attestation verification passed"
            exit 0
          fi
          if command -v /usr/bin/gh &>/dev/null; then
            exec /usr/bin/gh "$@"
          fi
          exit 0
          GHEOF
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          message: "true"
          branch: "true"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "false"
          pr-comments: "false"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action completed in dry-run mode
        run: |
          echo "Action completed successfully in dry-run mode"
          echo "PASS"
