name: Test author name and email checks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "false"
          branch: "false"
          author-name: "true"
          author-email: "true"
          dry-run: "true"
          job-summary: "true"
          pr-comments: "false"
          pr-title: "false"

      - name: Assert action ran or failed gracefully
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            echo "$RESULT" | python3 -c "import sys, json; data=json.load(sys.stdin); print('Parsed OK')" || {
              echo "FAIL: result is not valid JSON"
              exit 1
            }
            STATUS=$(echo "$RESULT" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('status', ''))" 2>/dev/null || echo "")
            echo "status: $STATUS"
            if [ -z "$STATUS" ]; then
              echo "FAIL: result JSON does not contain a 'status' field"
              exit 1
            fi
            echo "PASS: result is non-empty valid JSON with status=$STATUS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely attestation or network issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
