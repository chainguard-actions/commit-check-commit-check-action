name: Test with all checks disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ensure gh CLI is available
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          case "$(uname -m)" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          V=2.63.0
          curl -sSfL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${V}/gh_${V}_linux_${ARCH}.tar.gz"
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${V}_linux_${ARCH}/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          message: "false"
          branch: "false"
          author-name: "false"
          author-email: "false"
          job-summary: "false"
      - name: Assert pass with no scopes
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          python3 - <<'EOF'
          import json, os, sys
          data = json.loads(os.environ["RESULT"])
          if data["status"] != "pass":
              sys.exit(f"FAIL: expected status pass, got {data['status']}")
          if data["scopes"] != []:
              sys.exit(f"FAIL: expected no scopes, got {data['scopes']}")
          print("PASS")
          EOF
      - name: Assert nothing left in the workspace
        run: |
          if [ -d "$GITHUB_WORKSPACE/venv" ] || ls "$GITHUB_WORKSPACE"/commit_check-*.whl >/dev/null 2>&1; then
            echo "FAIL: action left install artifacts in the workspace"
            exit 1
          fi
          echo "PASS"
