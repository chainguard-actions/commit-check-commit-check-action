name: Test with all checks disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Ensure gh CLI is installed and authenticated
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install gh -y
          fi
          echo "gh version: $(gh --version)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run commit-check-action with all checks disabled
        id: action
        uses: .
        with:
          message: "false"
          branch: "false"
          author-name: "false"
          author-email: "false"
          dry-run: "false"
          job-summary: "false"
          pr-comments: "false"

      - name: Assert action completed successfully with no checks
        run: |
          echo "Action completed with all checks disabled"
          echo "PASS: action ran without failing (no checks enabled)"
