name: Test branch-only check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "false"
          branch: "true"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "false"
          pr-comments: "false"

      - name: Assert result output or graceful failure
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            echo "$RESULT" | python3 -c "import sys, json; json.load(sys.stdin)" || {
              echo "FAIL: result is not valid JSON"
              exit 1
            }
            STATUS=$(echo "$RESULT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('status',''))")
            echo "status: $STATUS"
            if [ "$STATUS" != "pass" ] && [ "$STATUS" != "fail" ] && [ "$STATUS" != "skip" ]; then
              echo "FAIL: unexpected status value '$STATUS'"
              exit 1
            fi
            echo "PASS: result is valid JSON with status=$STATUS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely gh attestation verify unavailable in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
