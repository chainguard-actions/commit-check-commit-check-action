name: Test all checks disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      # Run with all checks disabled - action should still complete
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "false"
          branch: "false"
          author-name: "false"
          author-email: "false"
          dry-run: "true"
          job-summary: "false"
          pr-comments: "false"

      - name: Assert action ran with all checks disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            # When all checks are disabled, result may be empty or have empty scopes
            if [ -n "$RESULT" ]; then
              STATUS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])" 2>/dev/null || echo "")
              SCOPE_COUNT=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d['scopes']))" 2>/dev/null || echo "0")
              echo "status: $STATUS"
              echo "scope count: $SCOPE_COUNT"
              if [ "$SCOPE_COUNT" != "0" ]; then
                echo "FAIL: expected 0 scopes when all checks disabled, got $SCOPE_COUNT"
                exit 1
              fi
            fi
            echo "PASS: action completed with all checks disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (attestation/sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
